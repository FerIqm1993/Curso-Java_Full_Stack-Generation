<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Playground</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Reto 1 -->
    <h1 class="text-primary text-center">Mi laboratorio Bootstrap</h1>
    <h1 class="text-danger">Mi laboratorio Bootstrap</h1>
    <h1 class="text-success">Mi laboratorio Bootstrap</h1>

    <hr>

    <!-- Reto 2 -->
    <button type="button" class="btn btn-primary">Primario</button>
    <button type="button" class="btn btn-success">Success</button>
    <button type="button" class="btn btn-danger">Danger</button>
    <button type="button" class="btn btn-warning">Warning</button>
    <button type="button" class="btn btn-outline-primary">Outline</button>
    <button type="button" class="btn btn-primary btn-lg">Large</button>
    <button type="button" class="btn btn-primary btn-sm">Small</button>

    <hr>

    <!-- Reto 3 -->
    <div class="bg-primary text-white p-3 m-3">
        Caja con p-3 y m-3
    </div>

    <hr>

    <!-- Reto 4 -->
    <div class="container">
        <div class="row">
            <div class="col-3 bg-primary text-white">1</div>
            <div class="col-3 bg-success text-white">2</div>
            <div class="col-3 bg-danger text-white">3</div>
        </div>
    </div>

    <hr>

    <!-- Reto 5 -->
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4 bg-primary text-white p-3 border">
                Tarjeta 1
            </div>
            <div class="col-12 col-md-6 col-lg-4 bg-success text-white p-3 border">
                Tarjeta 2
            </div>
            <div class="col-12 col-md-6 col-lg-4 bg-danger text-white p-3 border">
                Tarjeta 3
            </div>
        </div>
    </div>

</body>

</html>
