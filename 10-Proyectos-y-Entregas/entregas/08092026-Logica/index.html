<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retos de Lógica de Programación</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .resultados {
            margin-top: 20px;
            text-align: left;
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
        }
        .resultados p {
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mini Retos de Lógica</h1>
        <p>Ingresa una palabra para evaluar:</p>
        <input type="text" id="inputPalabra" placeholder="Ej. Ana, Computadora..." onkeydown="if(event.key === 'Enter') evaluarPalabra()">
        <br>
        <button type="button" onclick="evaluarPalabra()">Evaluar</button>

        <div class="resultados">
            <p id="resultadoVocales">Esperando entrada...</p>
            <p id="resultadoPalindromo"></p>
        </div>
    </div>

    <script src="logica-programacion.js"></script>
</body>
</html>
