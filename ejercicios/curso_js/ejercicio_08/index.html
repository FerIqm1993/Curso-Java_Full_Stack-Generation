<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 08 Cálculo de Velocidad y Volumen</title>
</head>

<body>
    <h1>Cálculos</h1>

    <section>
        <h2>Velocidad</h2>
        <label for="distancia">Distancia:</label>
        <input type="number" id="distancia">

        <label for="tiempo">Tiempo:</label>
        <input type="number" id="tiempo">

        <button onclick="manejarVelocidad()">Calcular velocidad</button>

        <p id="resultadoVelocidad" style="color: blue; font-weight: bold;"></p>
    </section>

    <section style="margin-top: 30px;">
        <h2>Volumen de Esfera</h2>
        <label for="radio">Radio:</label>
        <input type="number" id="radio">
        
        <button onclick="manejarVolumen()">Calcular volumen</button>
        
        <p id="resultadoVolumen" style="color: blue; font-weight: bold;"></p>
    </section>

    <script src="app.js"></script>
</body>

</html>
