<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14 - Fullstack (Java Backend)</title>
    <!-- Bootstrap para estilos rápidos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="text-center mb-4 text-primary">Nuestra Primera Conexión Frontend - Backend</h1>
        <p class="text-center text-muted mb-5">
            Este frontend de HTML+JS se está conectando a tu propio servidor escrito en Java (Backend.java), 
            en lugar de conectarse a FakeStore o DummyJSON.
        </p>

        <!-- FETCH PRODUCTOS DESDE JAVA -->
        <div class="card shadow-sm mb-5 p-4 border-success">
            <h3 class="text-success text-center">Productos (Desde Java)</h3>
            <div class="text-center my-3">
                <button id="btnProductos" class="btn btn-success">Obtener Productos de localhost:8081</button>
            </div>
            <div id="contenedorProductos" class="row mt-4"></div>
        </div>

        <!-- FETCH USUARIOS DESDE JAVA -->
        <div class="card shadow-sm mb-5 p-4 border-info">
            <h3 class="text-info text-center">Usuarios (Desde Java)</h3>
            <div class="text-center my-3">
                <button id="btnUsuarios" class="btn btn-info text-white">Obtener Usuarios de localhost:8081</button>
            </div>
            <div id="contenedorUsuarios" class="row mt-4"></div>
        </div>

    </div>

    <!-- Ejecutamos nuestra lógica de JavaScript -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
